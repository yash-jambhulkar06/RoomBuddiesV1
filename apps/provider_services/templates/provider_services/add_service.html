{% extends "base.html" %}

{% block title %}
    Add New Service | Room Buddies Provider
{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card-modern p-4 p-md-5 border-0 shadow-lg bg-white">
                <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                    <div>
                        <span class="badge badge-primary-soft mb-2">Provider Panel</span>
                        <h3 class="fw-bold text-dark mb-0 d-flex align-items-center gap-2">
                            <span>➕</span> Add New Service Listing
                        </h3>
                    </div>
                    <a href="{% url 'provider_services:my_services' %}" class="btn btn-sm btn-outline-secondary">
                        Cancel
                    </a>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="d-flex gap-2 justify-content-end mt-4 pt-3 border-top">
                        <a href="{% url 'provider_services:my_services' %}" class="btn btn-light border px-4">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-success px-4 shadow-sm">
                            Save Service Listing
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
