{% extends "base.html" %}

{% block title %}
    Edit Room - {{ room.title }} | Room Buddies
{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card-modern p-4 border-0 shadow-sm bg-white">
                <div class="d-flex align-items-center justify-content-between mb-3 pb-3 border-bottom">
                    <h3 class="fw-bold text-dark mb-0 d-flex align-items-center gap-2">
                        <span>✏️</span> Edit Room Listing
                    </h3>
                    <a href="{% url 'rooms:room_detail' room.id %}" class="btn btn-sm btn-outline-secondary">
                        Cancel
                    </a>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="d-flex gap-2 justify-content-end mt-4 pt-3 border-top">
                        <a href="{% url 'rooms:room_detail' room.id %}" class="btn btn-light border px-4">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-primary px-4">
                            Update Room Listing
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
