{% extends "base.html" %}

{% block title %}
    Login | Room Buddies
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card shadow-lg border-0">
        <div class="auth-header">
            <div class="auth-brand-logo">🔑</div>
            <h2 class="fw-bold text-dark mb-1">Welcome Back</h2>
            <p class="text-muted small">Log in to manage your room listings, bookings & chats</p>
        </div>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-gradient w-100 py-2 mt-3 mb-3">
                Log In
            </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
            <p class="text-muted small mb-0">
                Don't have an account? 
                <a href="{% url 'accounts:register' %}" class="fw-bold text-primary">Sign up here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
