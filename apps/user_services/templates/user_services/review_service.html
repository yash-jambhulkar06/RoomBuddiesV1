{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h2 class="mb-2">
                        Review Service
                    </h2>

                    <p class="text-muted mb-4">
                        {{ booking.service.title }}
                    </p>

                    <form method="POST">

                        {% csrf_token %}

                        <!-- Rating -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Rating
                            </label>

                            <select
                                name="rating"
                                class="form-select"
                                required>

                                <option value="">
                                    Select rating
                                </option>

                                <option value="5">
                                    ★★★★★ — Excellent
                                </option>

                                <option value="4">
                                    ★★★★☆ — Very Good
                                </option>

                                <option value="3">
                                    ★★★☆☆ — Good
                                </option>

                                <option value="2">
                                    ★★☆☆☆ — Poor
                                </option>

                                <option value="1">
                                    ★☆☆☆☆ — Very Poor
                                </option>

                            </select>

                        </div>

                        <!-- Comment -->
                        <div class="mb-4">

                            <label
                                for="comment"
                                class="form-label fw-semibold">

                                Your Review

                            </label>

                            <textarea
                                id="comment"
                                name="comment"
                                class="form-control"
                                rows="5"
                                placeholder="Share your experience..."
                                required></textarea>

                        </div>

                        <div class="d-flex gap-2">

                            <a
                                href="{% url 'user_services:my_service_bookings' %}"
                                class="btn btn-outline-secondary">

                                Cancel

                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary">

                                Submit Review

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
